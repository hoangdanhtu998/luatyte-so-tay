<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tài khoản · Sổ tay Luật Y tế</title>
<meta name="robots" content="noindex">
<link rel="icon" href="icon.svg">
<style>
  :root{
    --brand:#0F766E; --brand-600:#115E59; --brand-50:#F0FDFA; --brand-200:#99F6E4;
    --ink:#0F172A; --ink-2:#334155; --muted:#64748B; --line:#E2E8F0; --line-2:#CBD5E1;
    --surface:#FFFFFF; --bad:#B42318; --bad-50:#FEF3F2; --ok:#067647; --ok-50:#ECFDF3;
    --radius:16px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink);font-size:15px;line-height:1.5;
    background:linear-gradient(170deg,#ECFEFB 0%,#F6FBFA 45%,#FFFFFF 100%);min-height:100vh;
    display:flex;flex-direction:column;-webkit-font-smoothing:antialiased;
  }
  .topbar{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;max-width:1040px;width:100%;margin:0 auto}
  .brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);font-weight:700;font-size:15px}
  .brand img{width:34px;height:34px;display:block}
  .back{font-size:14px;color:var(--brand);text-decoration:none;font-weight:600;padding:8px 10px;border-radius:8px;min-height:40px;display:inline-flex;align-items:center}
  .back:hover{background:var(--brand-50)}

  main{flex:1;display:flex;align-items:flex-start;justify-content:center;padding:12px 16px 40px}
  .card{
    width:100%;max-width:420px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
    box-shadow:0 12px 40px rgba(15,23,42,.08);padding:28px 26px 26px;
  }
  .hero{text-align:center;margin:0 0 20px}
  .hero img{width:56px;height:56px;margin:0 auto 12px;display:block}
  .hero h1{font-size:22px;line-height:1.25;margin:0 0 6px;font-weight:700;letter-spacing:-.01em}
  .hero p{margin:0;color:var(--muted);font-size:14px}

  /* Tab kiểu nút chuyển */
  .seg{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:#F1F5F9;border-radius:12px;padding:4px;margin:0 0 22px}
  .seg button{border:0;background:transparent;border-radius:9px;padding:9px 10px;min-height:40px;font:inherit;font-weight:600;font-size:14px;color:var(--muted);cursor:pointer}
  .seg button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(15,23,42,.12)}
  .seg button:focus-visible{outline:3px solid #5EEAD4;outline-offset:1px}

  form{display:flex;flex-direction:column;gap:14px}
  .field{display:flex;flex-direction:column;gap:6px}
  .field > span{font-size:13px;font-weight:600;color:var(--ink-2)}
  .field input{
    font:inherit;font-size:16px;width:100%;min-height:48px;padding:12px 14px;border:1px solid var(--line-2);border-radius:12px;
    background:var(--surface);color:var(--ink);transition:border-color .15s,box-shadow .15s;
  }
  .field input::placeholder{color:#94A3B8}
  .field input:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 4px rgba(15,118,110,.16)}
  .field input:focus-visible{outline:none}
  .pw{position:relative}
  .pw input{padding-right:70px}
  .pw button{position:absolute;right:6px;top:50%;transform:translateY(-50%);background:none;border:0;color:var(--brand);font:inherit;font-size:13px;font-weight:600;padding:8px;min-height:36px;cursor:pointer;border-radius:8px}
  .pw button:hover{background:var(--brand-50)}
  .hint{font-size:12px;color:var(--muted);margin:-2px 0 0}

  .check{flex-direction:row;align-items:flex-start;gap:10px;font-size:13px;color:var(--ink-2);font-weight:500;line-height:1.5}
  .check input{width:18px;height:18px;min-height:0;margin:2px 0 0;flex:none;accent-color:var(--brand)}
  .check a{color:var(--brand);font-weight:600}

  button.primary{
    font:inherit;font-size:16px;font-weight:600;min-height:50px;width:100%;border:0;border-radius:12px;cursor:pointer;
    background:var(--brand);color:#fff;margin-top:4px;transition:background .15s;
  }
  button.primary:hover{background:var(--brand-600)}
  button.primary:disabled{opacity:.6;cursor:default}
  button.primary:focus-visible{outline:3px solid #5EEAD4;outline-offset:2px}

  .msg{font-size:14px;border-radius:10px;padding:10px 12px;margin:0;display:none;line-height:1.45}
  .msg.show{display:block}
  .msg.err{background:var(--bad-50);color:var(--bad)}
  .msg.ok{background:var(--ok-50);color:var(--ok)}

  .member{text-align:center}
  .member .avatar{width:56px;height:56px;border-radius:50%;background:var(--brand-50);color:var(--brand);display:grid;place-items:center;margin:0 auto 12px;font-weight:700;font-size:20px}
  .member p{margin:0 0 18px;color:var(--ink-2)}
  .member p strong{color:var(--ink)}
  .ghost{font:inherit;font-weight:600;font-size:15px;min-height:46px;width:100%;border-radius:12px;border:1px solid var(--line-2);background:var(--surface);color:var(--brand);cursor:pointer}
  .ghost:hover{background:var(--brand-50);border-color:var(--brand)}

  .hidden,[hidden]{display:none !important}
  @media (max-width:480px){ .card{padding:24px 18px} .topbar{padding:14px 16px} }
</style>
</head>
<body>
<div class="topbar">
  <a class="brand" href="index.html"><img src="icon.svg" alt="" width="34" height="34">Sổ tay Luật Y tế</a>
  <a class="back" href="index.html">Về sổ tay</a>
</div>

<main>
  <div style="width:100%;max-width:420px">
    <section class="card" id="guest">
      <div class="hero">
        <img src="icon.svg" alt="">
        <h1 id="hero-title">Chào mừng trở lại</h1>
        <p id="hero-sub">Đăng nhập để lưu tiến độ học và dùng các tính năng của tài khoản.</p>
      </div>

      <div class="seg" role="tablist" aria-label="Chọn đăng nhập hoặc đăng ký">
        <button type="button" role="tab" id="tab-login" aria-selected="true" aria-controls="form-login">Đăng nhập</button>
        <button type="button" role="tab" id="tab-register" aria-selected="false" aria-controls="form-register">Đăng ký</button>
      </div>

      <form id="form-login" role="tabpanel" aria-labelledby="tab-login" autocomplete="on" novalidate>
        <label class="field"><span>Email hoặc tên đăng nhập</span>
          <input name="identifier" required autocomplete="username" autocapitalize="none" spellcheck="false" placeholder="ten@vidu.vn hoặc tên_đăng_nhập">
        </label>
        <label class="field"><span>Mật khẩu</span>
          <span class="pw"><input name="password" type="password" required autocomplete="current-password" placeholder="Nhập mật khẩu">
            <button type="button" class="toggle-pw" aria-label="Hiện mật khẩu">Hiện</button></span>
        </label>
        <button type="submit" class="primary" id="login-btn">Đăng nhập</button>
        <p class="msg err" id="login-err" role="alert"></p>
      </form>

      <form id="form-register" role="tabpanel" aria-labelledby="tab-register" autocomplete="on" hidden novalidate>
        <label class="field"><span>Tên đăng nhập</span>
          <input name="username" required minlength="3" maxlength="30" pattern="[A-Za-z0-9_.]{3,30}" autocomplete="username" autocapitalize="none" spellcheck="false" placeholder="ví dụ: an_nguyen">
          <span class="hint">3 đến 30 ký tự: chữ, số, dấu gạch dưới (_) hoặc dấu chấm (.)</span>
        </label>
        <label class="field"><span>Email</span>
          <input name="email" type="email" required autocomplete="email" placeholder="ten@vidu.vn">
        </label>
        <label class="field"><span>Họ tên <em style="font-weight:400;color:var(--muted)">(không bắt buộc)</em></span>
          <input name="name" maxlength="100" autocomplete="name" placeholder="Nguyễn Văn An">
        </label>
        <label class="field"><span>Mật khẩu</span>
          <span class="pw"><input name="password" type="password" required minlength="10" autocomplete="new-password" placeholder="Ít nhất 10 ký tự">
            <button type="button" class="toggle-pw" aria-label="Hiện mật khẩu">Hiện</button></span>
        </label>
        <label class="check">
          <input type="checkbox" name="acceptTerms" required>
          <span>Tôi đồng ý với điều khoản sử dụng và chính sách bảo mật.</span>
        </label>
        <button type="submit" class="primary" id="register-btn">Tạo tài khoản</button>
        <p class="msg err" id="register-err" role="alert"></p>
        <p class="msg ok" id="register-ok" role="status"></p>
      </form>
    </section>

    <section class="card member hidden" id="member">
      <div class="avatar" id="avatar" aria-hidden="true">?</div>
      <p id="who"></p>
      <button type="button" class="ghost" id="out">Đăng xuất</button>
    </section>
  </div>
</main>

<script>
const $ = id => document.getElementById(id);
const tabs = { login: $('tab-login'), register: $('tab-register') };
const forms = { login: $('form-login'), register: $('form-register') };
const HERO = {
  login: ['Chào mừng trở lại', 'Đăng nhập để lưu tiến độ học và dùng các tính năng của tài khoản.'],
  register: ['Tạo tài khoản mới', 'Đăng ký miễn phí để lưu tiến độ học trên mọi thiết bị.'],
};

function showTab(name) {
  for (const k of Object.keys(tabs)) {
    tabs[k].setAttribute('aria-selected', String(k === name));
    forms[k].hidden = k !== name;
  }
  $('hero-title').textContent = HERO[name][0];
  $('hero-sub').textContent = HERO[name][1];
}
tabs.login.onclick = () => showTab('login');
tabs.register.onclick = () => showTab('register');

// Ẩn/hiện mật khẩu
document.querySelectorAll('.toggle-pw').forEach(b => b.onclick = () => {
  const i = b.parentElement.querySelector('input');
  const show = i.type === 'password';
  i.type = show ? 'text' : 'password';
  b.textContent = show ? 'Ẩn' : 'Hiện';
  b.setAttribute('aria-label', show ? 'Ẩn mật khẩu' : 'Hiện mật khẩu');
});

function setMsg(el, text) { el.textContent = text || ''; el.classList.toggle('show', !!text); }
const errText = (data, fallback) => (data && data.error && data.error.message) || fallback;

async function refresh() {
  const r = await fetch('/api/me', { credentials: 'same-origin' });
  if (r.ok) {
    const d = await r.json();
    const u = d.user || {};
    const name = u.username || u.email || '';
    $('avatar').textContent = name.charAt(0).toUpperCase();
    $('who').innerHTML = '';
    const strong = document.createElement('strong'); strong.textContent = name;
    $('who').append('Bạn đang đăng nhập với tài khoản ', strong, '.');
    $('guest').classList.add('hidden');
    $('member').classList.remove('hidden');
  } else {
    $('guest').classList.remove('hidden');
    $('member').classList.add('hidden');
  }
}

function busy(btn, on, label) { btn.disabled = on; btn.textContent = on ? 'Đang xử lý…' : label; }

$('form-login').onsubmit = async e => {
  e.preventDefault();
  const f = e.target, btn = $('login-btn');
  setMsg($('login-err'), '');
  if (!f.identifier.value.trim() || !f.password.value) { setMsg($('login-err'), 'Nhập email hoặc tên đăng nhập và mật khẩu.'); return; }
  busy(btn, true, 'Đăng nhập');
  try {
    const r = await fetch('/api/auth/login', {
      method: 'POST', headers: { 'content-type': 'application/json' }, credentials: 'same-origin',
      body: JSON.stringify({ identifier: f.identifier.value.trim(), password: f.password.value }),
    });
    const data = await r.json().catch(() => ({}));
    f.password.value = '';
    if (!r.ok) { setMsg($('login-err'), errText(data, 'Không đăng nhập được. Thử lại.')); return; }
    // Đăng nhập xong thì về sổ tay
    location.replace('index.html');
  } catch {
    setMsg($('login-err'), 'Không kết nối được máy chủ. Kiểm tra mạng rồi thử lại.');
  } finally { busy(btn, false, 'Đăng nhập'); }
};

$('form-register').onsubmit = async e => {
  e.preventDefault();
  const f = e.target, btn = $('register-btn');
  setMsg($('register-err'), ''); setMsg($('register-ok'), '');
  if (!f.acceptTerms.checked) { setMsg($('register-err'), 'Bạn cần đồng ý điều khoản để tạo tài khoản.'); return; }
  busy(btn, true, 'Tạo tài khoản');
  try {
    const r = await fetch('/api/auth/register', {
      method: 'POST', headers: { 'content-type': 'application/json' }, credentials: 'same-origin',
      body: JSON.stringify({
        username: f.username.value.trim(), email: f.email.value.trim(), name: f.name.value.trim(),
        password: f.password.value, acceptTerms: f.acceptTerms.checked,
      }),
    });
    const data = await r.json().catch(() => ({}));
    if (!r.ok) { setMsg($('register-err'), errText(data, 'Không tạo được tài khoản. Thử lại.')); return; }
    const name = f.username.value.trim();
    f.reset();
    showTab('login');
    $('form-login').identifier.value = name;
    $('form-login').password.focus();
    setMsg($('login-err'), '');
    setMsg($('register-ok'), '');
    // Thông báo thành công hiển thị ở tab đăng nhập
    const ok = document.createElement('p'); ok.className = 'msg ok show'; ok.textContent = 'Đã tạo tài khoản. Nhập mật khẩu để đăng nhập.';
    $('form-login').prepend(ok);
    setTimeout(() => ok.remove(), 6000);
  } catch {
    setMsg($('register-err'), 'Không kết nối được máy chủ. Kiểm tra mạng rồi thử lại.');
  } finally { busy(btn, false, 'Tạo tài khoản'); }
};

$('out').onclick = async () => {
  await fetch('/api/auth/logout', { method: 'POST', headers: { 'content-type': 'application/json' }, credentials: 'same-origin', body: '{}' });
  refresh();
};

refresh();
</script>
</body>
</html>
